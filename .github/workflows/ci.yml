name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust 1.95.0
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +1.95.0 fmt --all -- --check
      - name: Check lints
        run: cargo +1.95.0 clippy --workspace --all-targets --locked -- -D warnings
      - name: Run tests
        # `--no-fail-fast`: one failing test binary no longer hides every one
        # after it. The first hosted runs after the billing block each showed
        # only the first failure per OS, and the job still fails on any.
        #
        # Windows excludes tunnel-relay's own tests: the relay is not built
        # for Windows and refuses to start there (task row M6-C83). It still
        # compiles and passes clippy above, and its dependents' tests run.
        run: |
          set -euo pipefail
          # A plain string, not an array: macOS runs bash 3.2, where an empty
          # array under `set -u` is an unbound variable.
          exclude=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            exclude="--exclude tunnel-relay"
          fi
          # shellcheck disable=SC2086
          cargo +1.95.0 test --workspace --all-targets --locked --no-fail-fast $exclude
      - name: Validate example configurations
        run: |
          set -euo pipefail
          cargo +1.95.0 run --locked -p tunnel-client -- config check --config examples/m1-client.toml
          cargo +1.95.0 run --locked -p tunnel-client -- check-config examples/client.toml
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            # The relay refuses to start off Unix (task row M6-C83); the
            # relay examples are validated on the Linux and macOS jobs.
            exit 0
          fi
          cargo +1.95.0 run --locked -p tunnel-relay -- check-config examples/relay.toml
          # Dry-run every runnable serving example with the ServeConfig that
          # `serve --config` itself constructs. The legacy `check-config` above
          # parses a different type and cannot validate a serving document, so
          # without this step an example that fails relay startup ships green.
          # `serving_examples_are_exactly_the_files_the_ci_dry_run_glob_expands`
          # in crates/tunnel-relay/tests/example_configs.rs keeps this glob and
          # the classified serving examples in step.
          shopt -s nullglob
          serving_examples=(examples/*-relay.toml)
          if [ "${#serving_examples[@]}" -eq 0 ]; then
            echo "no examples/*-relay.toml serving example found; the dry run would validate nothing" >&2
            exit 1
          fi
          for example in "${serving_examples[@]}"; do
            echo "Dry-running serving configuration ${example}"
            cargo +1.95.0 run --locked -p tunnel-relay -- check-serve-config --config "${example}"
          done

  release-checks:
    name: M6-04 dependency, licence and secret checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          # **`fetch-depth: 0` is load-bearing, not tidiness.** The secret scan
          # walks every blob reachable from every ref. Under the default
          # shallow checkout `git rev-list --objects --all` returns one
          # commit's objects, so the scan would report zero findings over
          # almost nothing and look exactly like a clean history. The script's
          # own blob floor fails the job in that case rather than passing, but
          # the floor is the backstop; this is the fix.
          fetch-depth: 0
      - name: Install Rust 1.95.0
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Install cargo-deny 0.19.6
        # Pinned, and `--locked`: the deny.toml schema was read out of this
        # exact version's own `init` template. The script asserts the version
        # and fails rather than running an unknown one, because a renamed
        # config key that is silently ignored would make the policy pass over
        # nothing.
        run: cargo +1.95.0 install --locked cargo-deny@0.19.6
      - name: Populate the cargo registry cache
        # **Load-bearing, and its absence made this job known-broken rather
        # than merely unexercised.** The checks invoke cargo-deny with
        # `--offline` by default. On a fresh runner CARGO_HOME is empty, so
        # `cargo metadata` fails with "no matching package", cargo-deny emits
        # no summary record, and `deps` fails. `fetch` also extracts the crate
        # sources cargo-deny reads LICENSE text from when it resolves a
        # licence by file rather than by manifest field, so this covers both
        # needs. Alternatively pass `--no-offline` to the script.
        run: cargo +1.95.0 fetch --locked
      - name: Prove the checks can still fail
        # **Runs before the checks themselves, deliberately.** Each control
        # plants a synthetic case and requires the corresponding check to go
        # red. A green gate whose controls were never run is the defect class
        # docs/tasks.md row M5-C11 tracks; running them first means a broken
        # scanner fails the job instead of quietly passing it.
        run: python3 scripts/m6-release-checks.py --self-test
      - name: Dependency, licence, provenance, secret and visibility checks
        env:
          # `GET /repos/{owner}/{repo}` needs only `metadata: read`, which the
          # automatic `github.token` always carries, so the visibility check
          # runs here rather than being skipped.
          #
          # **It was skipped, and the stated reason was wrong.** The comment
          # claimed the check needed a token the job did not have. The effect
          # was worse than the inaccuracy: visibility is the gate's only
          # currently-red check, so omitting it made the automated form of the
          # gate go green on a repository that fails the gate -- an automation
          # that cannot report the one problem it exists to catch.
          #
          # This job is therefore expected to FAIL while the repository is
          # public (docs/tasks.md M6-C01). That is the correct behaviour and
          # must not be "fixed" by dropping the check again; it goes green when
          # the owner restores privacy.
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/m6-release-checks.py

  m1-acceptance:
    name: M1 real-socket acceptance (Redis)
    runs-on: ubuntu-latest
    # The M6-C65 restart gate adds a test build and about five minutes.
    timeout-minutes: 40
    services:
      redis:
        image: redis:8.4.0-alpine@sha256:6cbef353e480a8a6e7f10ec545f13d7d3fa85a212cdcc5ffaf5a1c818b9d3798
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
          --memory 256m
    env:
      RUST_LOG: info
      TEST_REDIS_URL: redis://127.0.0.1:6379/
      TUNNEL_CATALOG_REDIS_URL: redis://127.0.0.1:6379/
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust 1.95.0
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Build runnable workspace binaries
        run: cargo +1.95.0 build --workspace --bins --locked
      - name: Test authoritative Redis catalog
        run: cargo +1.95.0 test -p tunnel-catalog --test redis_catalog --locked -- --ignored
      - name: Verify production relay, client, authorization and transport failures
        run: cargo +1.95.0 run --locked -p tunnel-test-harness -- verify
      - name: Verify Redis AOF restart and explicit recovery
        run: bash scripts/m1-redis-restart-verify.sh
      # M6-C65: owns its own Redis container, like the step above; the
      # service Redis is not used.
      - name: Verify a single relay keeps its namespace across Redis restarts
        run: sh scripts/m6-redis-restart-verify.sh

  # M1-04: the M1 real-socket acceptance on the second advertised CI operating
  # system.  macOS runners have no service containers and no Docker, so Redis
  # comes from Homebrew and is started here, and the two restart gates above --
  # which own their own Docker containers -- are Linux-only by construction.
  # Windows has no M1 acceptance lane at all: the relay refuses to start off
  # Unix (M6-C83) and credential creation/import is unsupported there, which
  # docs/tasks.md M1-04 records as an owner decision rather than a skip.
  m1-acceptance-macos:
    name: M1 real-socket acceptance (macOS, Redis)
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      RUST_LOG: info
      TEST_REDIS_URL: redis://127.0.0.1:6379/
      TUNNEL_CATALOG_REDIS_URL: redis://127.0.0.1:6379/
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust 1.95.0
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Start Redis
        run: |
          set -euo pipefail
          brew install redis
          redis-server --version
          redis-server --port 6379 --bind 127.0.0.1 --save '' --appendonly no --daemonize yes
          for _ in $(seq 1 50); do
            if redis-cli -p 6379 ping | grep -q PONG; then exit 0; fi
            sleep 0.2
          done
          echo "Redis did not answer PING" >&2
          exit 1
      - name: Build runnable workspace binaries
        run: cargo +1.95.0 build --workspace --bins --locked
      - name: Test authoritative Redis catalog
        run: cargo +1.95.0 test -p tunnel-catalog --test redis_catalog --locked -- --ignored
      - name: Verify production relay, client, authorization and transport failures
        run: cargo +1.95.0 run --locked -p tunnel-test-harness -- verify

  m2-acceptance:
    name: M2 rotation and recovery (Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      redis:
        image: redis:8.4.0-alpine@sha256:6cbef353e480a8a6e7f10ec545f13d7d3fa85a212cdcc5ffaf5a1c818b9d3798
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
          --memory 256m
    env:
      RUST_LOG: info
      TEST_REDIS_URL: redis://127.0.0.1:6379/
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust 1.95.0
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Verify accelerated rotations and transport faults
        run: sh scripts/m2-harness-verify.sh accelerated
      - name: Verify three rotations at the actual 300-second interval
        run: sh scripts/m2-harness-verify.sh default

  m7-acceptance:
    name: M7 integration and Redis acceptance (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      redis:
        image: redis:8.4.0-alpine@sha256:6cbef353e480a8a6e7f10ec545f13d7d3fa85a212cdcc5ffaf5a1c818b9d3798
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
          --memory 256m
    env:
      RUST_LOG: info
      TEST_REDIS_URL: redis://127.0.0.1:6379/
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust 1.95.0
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Run M7 harness and Redis acceptance gates
        run: sh scripts/m7-harness-verify.sh

  m4-acceptance:
    name: M4 filesystem harness gates (Linux, Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      redis:
        image: redis:8.4.0-alpine@sha256:6cbef353e480a8a6e7f10ec545f13d7d3fa85a212cdcc5ffaf5a1c818b9d3798
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
          --memory 256m
    env:
      RUST_LOG: info
      TEST_REDIS_URL: redis://127.0.0.1:6379/
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust 1.95.0
        run: rustup toolchain install 1.95.0 --profile minimal
      # Gate 6 runs the shared TypeScript client's own sources under node,
      # which needs native type stripping (packages/client: node >= 24). The
      # gate imports no npm package, so there is no install step.
      - name: Install Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Run M4 filesystem harness gates
        run: sh scripts/m4-harness-verify.sh
