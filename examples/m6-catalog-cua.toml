# Catalog records for `tunnel-relay provision-catalog` that provision one CUA
# (`computer-v1`) export (M5 Lane B; docs/demo/cua.md). The tenant, user and
# device are the ones in examples/m6-catalog.toml; every UUID is a synthetic
# placeholder.
#
# **A CUA export drives a real pointer and keyboard. Serve it only from a
# dedicated, disposable machine** (docs/testing.md, "Disposable Linux CUA
# VM"), never from anyone's desktop.
#
# The relay configuration given with --config must list the profile:
#
#   [http_forward]
#   profiles = ["computer-v1"]
#
# The device runs a tunnel-client built with `--features cua`, with
# AGENT_TUNNEL_CUA_LANE_B=1 in its environment, and an export table named by
# service.id:
#
#   [exports."77777777-7777-4777-8777-777777777777"]
#   type = "http-forward"
#
#   [exports."77777777-7777-4777-8777-777777777777".cua]
#   profile = "computer-v1"
#   point_width = 1280
#   point_height = 800
#   operations = ["describe", "capture", "screen_info", "cursor_position",
#                 "click", "double_click", "move", "drag", "scroll",
#                 "type_text", "press_key", "hotkey"]
#
#   [exports."77777777-7777-4777-8777-777777777777".cua.backend]
#   command = "/opt/cua-fixture/cua-backend-supervised.sh"
#   args = ["/home/cua/cua-export/backend.address"]
#   workspace = "/home/cua/cua-export"
#   address_file = "/home/cua/cua-export/backend.address"
#   env = { PATH = "/usr/local/bin:/usr/bin:/bin", HOME = "/home/cua" }
#
# Consumers then call
# https://<consumer listener>/v1/devices/<device.id>/services/<service.id>/http/computer
# with POST over HTTP/2 and a token whose scope includes http:invoke.

[tenant]
id = "11111111-1111-4111-8111-111111111111"
display_name = "Trial tenant"

[user]
id = "22222222-2222-4222-8222-222222222222"
display_name = "Trial user"
oidc_subject = "trial-user"
role = "member"

[device]
id = "33333333-3333-4333-8333-333333333333"
display_name = "Trial CUA VM"
certificate = "device-cert.pem"

[service]
id = "77777777-7777-4777-8777-777777777777"
type = "http-forward"
display_name = "Trial CUA desktop (disposable VM)"
operations = ["http:invoke"]
http_forward_profile = "computer-v1"

[grant]
operations = ["http:invoke"]
