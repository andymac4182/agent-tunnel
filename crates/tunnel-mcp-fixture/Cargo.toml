[package]
name = "tunnel-mcp-fixture"
description = "Deterministic synthetic MCP server fixture (official rmcp SDK) and M3-02 export end-to-end tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "tunnel-mcp-fixture"
path = "src/main.rs"

# rmcp is pinned exactly (docs/mcp.md, "Pinned in code"): the fixture server
# and the test client are the official Rust MCP SDK at this version.
[dependencies]
rmcp = { version = "=3.4.0", default-features = false, features = ["server", "transport-io"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["fs", "io-std", "io-util", "macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1.7", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["service", "tokio"] }
rmcp = { version = "=3.4.0", default-features = false, features = [
    "client",
    "server",
    "transport-io",
    "transport-streamable-http-client-unix-socket",
    "transport-streamable-http-server",
] }
tempfile = "3.21"
toml = { workspace = true }
http-body = "1"
tokio-util = { version = "0.7", default-features = false }
tunnel-http-bridge = { path = "../tunnel-http-bridge" }
tunnel-mcp = { path = "../tunnel-mcp" }
tunnel-mcp-export = { path = "../tunnel-mcp-export" }

[lints]
workspace = true
