[package]
name = "tunnel-acp-export"
description = "Device-side ACP supervisor: one stdio child, bounded channels, the pure lifecycle, and process-group cleanup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The supervisor half of M8-02 and the lifecycle half of M8-03.  It owns a
# child process and a clock; the decisions are `tunnel_acp::lifecycle`'s, which
# owns neither.  There is no HTTP, no SSE, no Axum and no tunnel here: those
# are chunks 3 to 5.
[dependencies]
bytes = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
serde = { workspace = true }
serde_json = "1.0"
tokio = { version = "1.48", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util = { version = "0.7", default-features = false }
tunnel-acp = { path = "../tunnel-acp" }
tunnel-http-bridge = { path = "../tunnel-http-bridge" }
tunnel-http-forward = { path = "../tunnel-http-forward" }

[target.'cfg(unix)'.dependencies]
# Safe process-group signalling, exactly as `tunnel-mcp-export` does it, so
# this crate keeps `forbid(unsafe_code)`.
rustix = { version = "1.1", default-features = false, features = ["process", "std"] }

# The end-to-end supervisor tests live in `tunnel-acp-fixture/tests`, because
# only the crate that defines the fixture binary gets `CARGO_BIN_EXE_*`.  That
# is the same arrangement `tunnel-mcp-fixture` already uses for
# `tunnel-mcp-export`.
[dev-dependencies]
tempfile = "3.21"
toml = { workspace = true }
tokio = { version = "1.48", features = [
    "io-util",
    "macros",
    "process",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
] }

[lints]
workspace = true
