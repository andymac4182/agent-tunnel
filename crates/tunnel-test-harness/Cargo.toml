[package]
name = "tunnel-test-harness"
description = "Reusable fixtures and real-socket harness for Agent Tunnel acceptance tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.89"
bytes = "1"
http = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing = "0.1"
chrono = { version = "0.4", features = ["clock", "serde"] }
http-body-util = "0.1"
hyper = { version = "1.7", features = ["http1", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
rcgen = "0.13"
rsa = { version = "0.9", features = ["pem"] }
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
serde.workspace = true
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.13"
time = "0.3"
tokio = { version = "1.40", features = ["full"] }
redis = { version = "1.7.0", default-features = false, features = [
    "tokio-comp",
    "script",
    "tokio-rustls-comp",
    "tls-rustls-webpki-roots",
] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "__rustls-tls"] }
tunnel-catalog = { path = "../tunnel-catalog" }
tunnel-cluster = { path = "../tunnel-cluster" }
tunnel-client = { path = "../tunnel-client" }
tunnel-http-bridge = { path = "../tunnel-http-bridge" }
tunnel-http-forward = { path = "../tunnel-http-forward" }
tunnel-core = { path = "../tunnel-core" }
tokio-util = { version = "0.7", features = ["rt"] }
tunnel-relay = { path = "../tunnel-relay" }
tunnel-transport = { path = "../tunnel-transport" }
tunnel-protocol = { path = "../tunnel-protocol" }
futures-util = { version = "0.3", features = ["sink", "std"] }
uuid = { version = "1.10", features = ["v4", "serde"] }

[lints]
workspace = true
