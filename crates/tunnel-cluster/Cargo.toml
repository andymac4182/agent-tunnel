[package]
name = "tunnel-cluster"
description = "Signed relay membership, peer records and cluster routing contracts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22.1"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["clock", "serde"] }
ring = "0.17.14"
serde.workspace = true
serde_json = "1.0.145"
sha2 = "0.10.9"
tokio = { version = "1.53.1", features = ["io-util", "macros", "rt", "sync", "time"] }
tokio-util = { version = "0.7.16", features = ["rt"] }
tunnel-catalog = { path = "../tunnel-catalog" }
uuid = { version = "1.26.0", features = ["serde", "v4"] }

[lints]
workspace = true
