[package]
name = "tunnel-cua-fixture"
description = "Deterministic synthetic CUA backend on loopback: synthetic marker images, an authoritative in-memory ledger, and fault injection after the ledger entry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# **Lane A only. This fixture cannot touch a screen or an input device, and
# that is checkable rather than assertable**: `tunnel-cua/tests/host_untouched.rs`
# reads this manifest and refuses anything outside its allowlist, and walks
# this crate's transitive closure in `Cargo.lock` for input/capture crates.
#
# The HTTP/1.1 server and client here are hand-written over `tokio::net`
# rather than taken from `hyper`. That is deliberate and is not
# not-invented-here: the fixture's whole job is to emit responses a correct
# HTTP library refuses to produce -- a body truncated mid-framing, a
# connection dropped after the ledger entry exists, a pre-dispatch 401 with no
# `data:` event -- and a library would fight every one of them. It also keeps
# the dependency surface this crate is judged on down to `tokio` and
# `serde_json`.
[[bin]]
name = "tunnel-cua-fixture"
path = "src/main.rs"

[dependencies]
serde_json = "1.0"
tokio = { version = "1.48", features = [
    "fs",
    "io-std",
    "io-util",
    "macros",
    "process",
    "net",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
] }
tunnel-cua = { path = "../tunnel-cua" }
# The supervisor under test. The end-to-end supervision evidence lives here
# rather than in the export crate because only the crate that defines the
# fixture binary can exec it.
tunnel-cua-export = { path = "../tunnel-cua-export" }

[target.'cfg(unix)'.dependencies]
# `setsid` and `getpgrp` for the escaping descendant, safely, so this crate
# stays `forbid(unsafe_code)`.
rustix = { version = "1.1", default-features = false, features = ["process", "std"] }

[dev-dependencies]
tempfile = "3.21"
# The sentinel, so a test can point the supervisor at it -- and, in the
# control, deliberately at nothing.
tunnel-deadman = { path = "../tunnel-deadman" }

[lints]
workspace = true
