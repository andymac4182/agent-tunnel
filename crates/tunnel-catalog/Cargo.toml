[package]
name = "tunnel-catalog"
description = "Tenant-scoped durable identity, credential, ownership, and grant catalog"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[dependencies]
async-trait = "0.1.89"
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["clock", "serde"] }
jsonwebtoken = { version = "9.3.1", default-features = true }
ring = "0.17.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
redis = { version = "1.7.0", default-features = false, features = ["tokio-comp", "script", "tokio-rustls-comp", "tls-rustls-webpki-roots"] }
tokio = { version = "1.52.1", features = ["sync", "time"] }
uuid = { version = "1.24.0", features = ["serde", "v4"] }

[dev-dependencies]
tokio = { version = "1.52.1", features = ["io-util", "macros", "rt-multi-thread", "sync", "time"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
