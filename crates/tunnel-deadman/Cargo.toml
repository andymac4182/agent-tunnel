[package]
name = "tunnel-deadman"
description = "A parent-death sentinel: a sibling process that kills a supervised process group when the supervisor's write end of a pipe closes, including on SIGKILL"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "tunnel-deadman"
path = "src/main.rs"

[dependencies]

[target.'cfg(unix)'.dependencies]
# Safe process-group signalling; this crate is `forbid(unsafe_code)`.
# `fs` is for `access(EXEC_OK)` in the sentinel resolution rule (M6-C08): a
# mode-bit test answers "some execute bit is set", which is not the question
# the caller is asking. See `is_executable_regular_file`.
rustix = { version = "1.1", default-features = false, features = ["fs", "process", "std"] }

[dev-dependencies]
tempfile = "3.21"

[lints]
workspace = true
