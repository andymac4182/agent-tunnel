[package]
name = "tunnel-deadman"
description = "A parent-death sentinel: a sibling process that kills a supervised process group when the supervisor's write end of a pipe closes, including on SIGKILL"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "tunnel-deadman"
path = "src/main.rs"

[dependencies]

[target.'cfg(unix)'.dependencies]
# Safe process-group signalling; this crate is `forbid(unsafe_code)`.
rustix = { version = "1.1", default-features = false, features = ["process", "std"] }

[dev-dependencies]
tempfile = "3.21"

[lints]
workspace = true
