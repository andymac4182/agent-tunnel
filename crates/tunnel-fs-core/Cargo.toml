# Deliberately dependency-free, like tunnel-http-forward.  The descriptor JSON
# is hand-emitted so field order, escaping and the closed field set are pinned
# by construction rather than by a serializer's configuration.  Nothing here
# touches a real filesystem, a clock, a socket or an allocator budget.

