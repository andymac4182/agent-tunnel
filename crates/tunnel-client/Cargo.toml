[package]
name = "tunnel-client"
description = "Mutually authenticated outbound agent tunnel CLI and client runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tunnel-core.workspace = true
tunnel-protocol = { path = "../tunnel-protocol" }
tunnel-http-bridge = { path = "../tunnel-http-bridge" }
tunnel-mcp-export = { path = "../tunnel-mcp-export" }
bytes = "1"
http = "1"
http-body-util = "0.1"
tunnel-transport = { path = "../tunnel-transport" }
futures-util = { version = "0.3.31", features = ["sink", "std"] }
rcgen = "0.13"
rustls = { version = "0.23.38", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2.2"
serde.workspace = true
serde_json = "1.0"
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "__rustls-tls"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml.workspace = true
url = "2.5"
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
tempfile = "3.21"

[lints]
workspace = true
