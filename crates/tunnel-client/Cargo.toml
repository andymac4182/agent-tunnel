[package]
name = "tunnel-client"
description = "Mutually authenticated outbound agent tunnel CLI and client runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tunnel-core.workspace = true
tunnel-protocol = { path = "../tunnel-protocol" }
tunnel-http-bridge = { path = "../tunnel-http-bridge" }
tunnel-mcp-export = { path = "../tunnel-mcp-export" }
bytes = "1"
http = "1"
http-body-util = "0.1"
tunnel-transport = { path = "../tunnel-transport" }
futures-util = { version = "0.3.31", features = ["sink", "std"] }
rcgen = "0.13"
rustls = { version = "0.23.38", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2.2"
serde.workspace = true
serde_json = "1.0"
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "__rustls-tls"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml.workspace = true
url = "2.5"
uuid = { version = "1.18", features = ["v4"] }
# M4 gate 4: the device half of the filesystem endpoint.
tunnel-fs-core = { path = "../tunnel-fs-core" }
tunnel-fs-ninep = { path = "../tunnel-fs-ninep" }
tunnel-fs-provider = { path = "../tunnel-fs-provider" }

# The resolver is Unix-only, for the reason gate 2 records: filesystem
# exports are declared unsupported on Windows, where `tunnel-fs-host`
# compiles to that declaration alone and this connector serves no session.
[target.'cfg(unix)'.dependencies]
tunnel-fs-host = { path = "../tunnel-fs-host" }

[dev-dependencies]
tempfile = "3.21"

[lints]
workspace = true
