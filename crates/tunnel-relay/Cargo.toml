[package]
name = "tunnel-relay"
description = "Axum relay for the authenticated multi-user agent tunnel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tower = "0.5"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22"
bytes = "1"
http = "1"
http-body = "1"
chrono = { version = "0.4", features = ["clock"] }
futures-util = "0.3"
http-body-util = "0.1"
hyper = { version = "1.7", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
libc = "0.2"
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.48", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
tunnel-core.workspace = true
tunnel-catalog = { path = "../tunnel-catalog" }
tunnel-cluster = { path = "../tunnel-cluster" }
tunnel-http-bridge = { path = "../tunnel-http-bridge" }
tunnel-http-forward = { path = "../tunnel-http-forward" }
tunnel-protocol = { path = "../tunnel-protocol" }
tunnel-transport = { path = "../tunnel-transport" }
serde.workspace = true
toml.workspace = true

[features]
# Test infrastructure only (the `http-forward/1` fixture hold).  Enabled by
# `tunnel-test-harness`; a relay built without it refuses a fixture hold.
test-fixtures = []

[dev-dependencies]
async-trait = "0.1.89"
h3 = "0.0.8"
h3-quinn = "0.0.10"
http-body-util = "0.1"
rcgen = "0.13"
tokio = { version = "1.48", features = ["test-util"] }

[lints]
workspace = true
