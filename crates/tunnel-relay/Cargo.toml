[package]
name = "tunnel-relay"
description = "Axum relay for the authenticated multi-user agent tunnel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tower = "0.5"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["clock"] }
futures-util = "0.3"
http-body-util = "0.1"
hyper = { version = "1.7", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
jsonwebtoken = "9.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.48", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
tunnel-core.workspace = true
tunnel-catalog = { path = "../tunnel-catalog" }
tunnel-protocol = { path = "../tunnel-protocol" }
tunnel-transport = { path = "../tunnel-transport" }
serde.workspace = true
toml.workspace = true

[dev-dependencies]
http-body-util = "0.1"

[lints]
workspace = true
