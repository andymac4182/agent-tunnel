[workspace]
members = ["crates/tunnel-core", "crates/tunnel-client", "crates/tunnel-relay"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "1.0"
tunnel-core = { path = "crates/tunnel-core" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
